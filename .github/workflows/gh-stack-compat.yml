# opengt is a translation layer over an extension at v0.1.1, so it can break
# without a single line of its own changing. This job answers one question:
# does gt still work against the gh-stack release you point it at?
#
# It runs daily against the latest release. Dispatch it by hand with a tag to
# test a specific version, or to check whether a failure is new by re-running
# against the version opengt targets.
name: gh-stack compatibility

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'gh-stack release to test: a tag such as v0.1.1, or "latest"'
        required: false
        default: latest
        type: string
  schedule:
    # 05:17 UTC daily. GitHub disables scheduled workflows in a repository with
    # no activity for 60 days; a manual dispatch re-enables them.
    - cron: '17 5 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: gh-stack-compat

env:
  # A scheduled run has no inputs, so it tests the latest release.
  VERSION: ${{ github.event.inputs.version || 'latest' }}
  ISSUE_LABEL: gh-stack-compat

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the gh stack extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$VERSION" = latest ]; then
            gh extension install github/gh-stack --force
          else
            gh extension install github/gh-stack --pin "$VERSION" --force
          fi
          gh stack --version

      # The tests run with no GH_TOKEN on purpose. Everything they exercise is
      # meant to work locally, so a command that starts needing the API fails
      # here instead of passing quietly.
      - name: Integration tests
        run: |
          set -o pipefail
          go test -tags=integration -timeout 15m ./test/integration/ 2>&1 | tee test-output.txt

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "\`gh stack\` **$VERSION** no longer matches what opengt expects."
            echo
            echo "- Run: $run_url"
            echo "- Requested version: \`$VERSION\`"
            echo
            if [ -f test-output.txt ]; then
              echo '```'
              tail -c 30000 test-output.txt
              echo '```'
            else
              echo "The run failed before the tests started; see the log."
            fi
          } > issue-body.md

          # gh issue create rejects a label that does not exist yet.
          gh label create "$ISSUE_LABEL" --color B60205 \
            --description "gt no longer works against a gh-stack release" 2>/dev/null || true

          open=$(gh issue list --state open --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            # One issue per outage, not one per day.
            gh issue comment "$open" --body-file issue-body.md
          else
            gh issue create --title "gh-stack compatibility broke against $VERSION" \
              --label "$ISSUE_LABEL" --body-file issue-body.md
          fi

      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment \
              "The integration tests pass again against \`gh stack\` $VERSION: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
